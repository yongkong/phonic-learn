<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone 15 Pro Frame</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f0f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .device-wrapper {
    position: relative;
    width: 390px;
    height: 844px;
    background: #1a1a1a;
    border-radius: 55px;
    padding: 12px;
    box-shadow:
      0 0 0 2px #333,
      0 0 0 4px #1a1a1a,
      0 20px 60px rgba(0,0,0,0.3),
      inset 0 0 2px rgba(255,255,255,0.1);
  }
  .device-screen {
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: #F8F9FA;
    position: relative;
  }
  .device-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .dynamic-island {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 36px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
    pointer-events: none;
  }
  .device-label {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #666;
    font-weight: 500;
  }
  /* Side buttons */
  .device-wrapper::before {
    content: '';
    position: absolute;
    right: -3px;
    top: 200px;
    width: 4px;
    height: 80px;
    background: #333;
    border-radius: 0 2px 2px 0;
  }
  .device-wrapper::after {
    content: '';
    position: absolute;
    left: -3px;
    top: 180px;
    width: 4px;
    height: 32px;
    background: #333;
    border-radius: 2px 0 0 2px;
    box-shadow:
      0 50px 0 #333,
      0 90px 0 #333;
  }
</style>
</head>
<body>
  <div style="display:flex;flex-direction:column;align-items:center;">
    <div class="device-wrapper">
      <div class="device-screen" id="screen">
        <iframe id="contentFrame" src="about:blank"></iframe>
      </div>
      <div class="dynamic-island"></div>
    </div>
    <div class="device-label" id="label">WordWorld 单词世界</div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const screenPath = params.get('screen');
  const label = params.get('label') || '';
  if (screenPath) {
    document.getElementById('contentFrame').src = screenPath;
  }
  if (label) {
    document.getElementById('label').textContent = label;
  }
</script>
</body>
</html>
