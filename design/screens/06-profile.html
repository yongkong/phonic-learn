<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordWorld - 个人中心</title>
<link rel="stylesheet" href="../css/tokens.css">
<style>
  .profile-screen {
    min-height: 100%;
    background: var(--bg);
    padding-bottom: 100px;
  }

  .profile-head {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-lg) var(--space-xl) 0;
  }
  .big-avatar {
    width: 64px; height: 64px;
    border-radius: var(--radius-lg);
    background: #D6DEFF;
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff;
    box-shadow: var(--shadow-md);
    flex-shrink: 0;
  }
  .profile-name {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 800;
  }
  .profile-sub {
    font-size: 13px;
    font-weight: 700;
    color: var(--fg-secondary);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .profile-sub .streak {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    color: var(--accent-dark);
  }
  .edit-btn {
    margin-left: auto;
    border: none;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--fg-secondary);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 800;
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: var(--transition-fast);
  }
  .edit-btn:active { transform: scale(0.94); }

  /* 等级卡 */
  .level-card {
    margin: var(--space-lg) var(--space-xl) 0;
    background: linear-gradient(135deg, var(--primary-light), var(--primary));
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    color: #fff;
    box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
  }
  .level-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-md);
  }
  .level-name {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .level-xp {
    font-size: 13px;
    font-weight: 800;
    font-family: var(--font-display);
    opacity: 0.9;
  }
  .level-card .progress-bar { background: rgba(255,255,255,0.25); height: 12px; }
  .level-card .progress-fill { background: #fff; }
  .level-foot {
    margin-top: var(--space-sm);
    font-size: 12px;
    font-weight: 600;
    opacity: 0.85;
  }

  /* 数据统计 */
  .stats-row { margin: var(--space-lg) var(--space-xl) 0; }
  .stat-card .stat-value { color: var(--fg); }
  .stat-card.s1 .stat-value { color: var(--primary); }
  .stat-card.s2 .stat-value { color: var(--accent-dark); }
  .stat-card.s3 .stat-value { color: var(--success-dark); }

  .section {
    margin: var(--space-lg) var(--space-xl) 0;
  }
  .section-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 800;
    margin-bottom: var(--space-md);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .more {
    margin-left: auto;
    font-size: 12px;
    font-weight: 800;
    color: var(--primary);
    cursor: pointer;
    font-family: var(--font-body);
    background: none;
    border: none;
  }

  /* 复习提醒 */
  .review-card {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-md) var(--space-lg);
    box-shadow: var(--shadow-sm);
  }
  .review-icon {
    width: 44px; height: 44px;
    border-radius: var(--radius-sm);
    background: var(--warning-soft);
    color: #B45309;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .review-body { flex: 1; }
  .review-title { font-size: 15px; font-weight: 800; }
  .review-desc { font-size: 12px; font-weight: 600; color: var(--fg-secondary); margin-top: 1px; }
  .review-go {
    border: none;
    background: var(--warning-soft);
    color: #B45309;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 800;
    padding: 9px 16px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: var(--transition-fast);
  }
  .review-go:active { transform: scale(0.94); }

  /* 错词本 */
  .mistake-card {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-md) var(--space-lg);
    box-shadow: var(--shadow-sm);
  }
  .mistake-icon {
    width: 44px; height: 44px;
    border-radius: var(--radius-sm);
    background: var(--error-soft);
    color: var(--error);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .mistake-words { display: flex; gap: 6px; margin-top: 5px; }
  .mistake-words .w {
    font-size: 11px;
    font-weight: 800;
    font-family: var(--font-display);
    color: var(--fg-secondary);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    padding: 2px 10px;
    border-radius: var(--radius-pill);
  }

  /* 勋章墙 */
  .medal-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-md);
  }
  .medal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-md) var(--space-xs);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow-sm);
  }
  .medal .m-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .medal.locked .m-icon { background: #E3E5F3 !important; color: var(--fg-tertiary); }
  .medal .m-name { font-size: 11px; font-weight: 800; color: var(--fg-secondary); text-align: center; }
  .medal.locked .m-name { color: var(--fg-tertiary); }
  .medal .m-icon.g1 { background: linear-gradient(135deg, #FB923C, var(--accent)); }
  .medal .m-icon.g2 { background: linear-gradient(135deg, #818CF8, var(--primary)); }
  .medal .m-icon.g3 { background: linear-gradient(135deg, #34D399, var(--success)); }
  .medal .m-icon.g4 { background: linear-gradient(135deg, #FBBF24, #D97706); }

  /* 设置 */
  .setting-row {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-md) var(--space-lg);
    box-shadow: var(--shadow-sm);
  }
  .setting-row + .setting-row { margin-top: var(--space-md); }
  .setting-icon {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    background: var(--primary-soft);
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .setting-body { flex: 1; }
  .setting-name { font-size: 15px; font-weight: 800; }
  .setting-desc { font-size: 12px; font-weight: 600; color: var(--fg-tertiary); margin-top: 1px; }

  /* 开关 */
  .toggle {
    position: relative;
    width: 52px; height: 32px;
    border-radius: var(--radius-pill);
    background: var(--border-strong);
    border: none;
    cursor: pointer;
    transition: var(--transition-normal);
    flex-shrink: 0;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    box-shadow: var(--shadow-sm);
    transition: var(--transition-normal);
  }
  .toggle.on { background: var(--success); }
  .toggle.on::after { transform: translateX(20px); }

  .goal-stepper {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition-fast);
  }
  .step-btn:active { transform: scale(0.88); }
  .goal-val {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 800;
    min-width: 52px;
    text-align: center;
  }
</style>
</head>

<script>
  document.querySelectorAll('.toggle').forEach(t => {
    t.addEventListener('click', () => {
      t.classList.toggle('on');
      t.setAttribute('aria-checked', t.classList.contains('on'));
    });
  });
  const goal = document.querySelector('.goal-val');
  let n = 20;
  document.querySelectorAll('.step-btn').forEach(b => {
    b.addEventListener('click', () => {
      n = Math.min(60, Math.max(10, n + (b.textContent.trim() === '+' ? 5 : -5)));
      goal.textContent = n + ' 词';
    });
  });
