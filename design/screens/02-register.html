<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordWorld - 年级注册</title>
<link rel="stylesheet" href="../css/tokens.css">
<style>
  .register-screen {
    background: linear-gradient(180deg, #E8F4FD 0%, #F8F9FA 30%);
    min-height: 100%;
    padding: 20px var(--space-xl);
    padding-bottom: 50px;
  }
  .register-header {
    text-align: center;
    padding: 20px 0 var(--space-2xl);
  }
  .register-wave {
    font-size: 48px;
    display: inline-block;
    animation: bounce 2s ease infinite;
  }
  .register-greeting {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: bold;
    color: var(--fg);
    margin-top: var(--space-md);
  }
  .register-subtitle {
    font-size: 16px;
    color: var(--fg-secondary);
    margin-top: var(--space-xs);
  }
  .register-form {
    display: flex;
    flex-direction: column;
    gap: var(--space-xl);
  }
  .form-group label {
    display: block;
    font-size: 16px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: var(--space-sm);
  }
  .nickname-input {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px var(--space-lg);
    transition: var(--transition-fast);
  }
  .nickname-input:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.12);
  }
  .nickname-input .input-icon {
    font-size: 24px;
  }
  .nickname-input input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 17px;
    font-family: var(--font-body);
    background: transparent;
  }
  .nickname-input input::placeholder {
    color: var(--fg-tertiary);
  }
  .grade-label {
    font-size: 16px;
    font-weight: 600;
    color: var(--fg);
  }
  .grade-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-md);
  }
  .grade-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    text-align: center;
    cursor: pointer;
    transition: var(--transition-normal);
    -webkit-tap-highlight-color: transparent;
  }
  .grade-card:active {
    transform: scale(0.96);
  }
  .grade-card.selected {
    border-color: var(--primary);
    background: rgba(74, 144, 217, 0.06);
    box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.12);
  }
  .grade-emoji {
    font-size: 36px;
    display: block;
    margin-bottom: var(--space-sm);
  }
  .grade-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--fg);
  }
  .grade-stars {
    margin-top: var(--space-xs);
    font-size: 14px;
    letter-spacing: 2px;
  }
  .grade-stars .star-filled { color: var(--secondary); }
  .grade-stars .star-empty { color: var(--border); }
  .register-bottom {
    margin-top: var(--space-2xl);
    padding-top: var(--space-lg);
  }
  .register-bottom .btn {
    width: 100%;
  }
  .skip-link {
    display: block;
    text-align: center;
    margin-top: var(--space-md);
    color: var(--fg-tertiary);
    font-size: 15px;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar dark">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="6" width="3" height="6" rx="0.5" fill="currentColor" opacity="0.3"/><rect x="4.5" y="4" width="3" height="8" rx="0.5" fill="currentColor" opacity="0.5"/><rect x="9" y="2" width="3" height="10" rx="0.5" fill="currentColor" opacity="0.7"/><rect x="13" y="0" width="3" height="12" rx="0.5" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 3.6C10.2 3.6 12.2 4.6 13.5 6.2L15 4.5C13.3 2.5 10.8 1.2 8 1.2S2.7 2.5 1 4.5L2.5 6.2C3.8 4.6 5.8 3.6 8 3.6z" fill="currentColor" opacity="0.3"/><path d="M8 7c1.3 0 2.5.6 3.3 1.5L12.5 9.8C11.4 8.5 9.8 7.7 8 7.7s-3.4.8-4.5 2.1l1.2-1.3C5.5 7.6 6.7 7 8 7z" fill="currentColor" opacity="0.6"/><circle cx="8" cy="10.8" r="1.2" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="21" height="10" rx="2" stroke="currentColor" stroke-width="1" fill="none"/><rect x="22" y="4" width="2.5" height="4" rx="1" fill="currentColor" opacity="0.4"/><rect x="1.5" y="2.5" width="14" height="7" rx="1" fill="currentColor"/></svg>
    </span>
  </div>

  <div class="screen-content">
    <div class="register-screen">
      <div class="register-header">
        <span class="register-wave">👋</span>
        <div class="register-greeting">Hi，小朋友！</div>
        <div class="register-subtitle">告诉 WordWorld 你几年级呀？</div>
      </div>

      <div class="register-form">
        <div class="form-group">
          <label>你的名字</label>
          <div class="nickname-input">
            <span class="input-icon">🧒</span>
            <input type="text" placeholder="输入你的名字" value="小明" id="nicknameInput">
          </div>
        </div>

        <div class="form-group">
          <label class="grade-label">选择你的年级</label>
          <div class="grade-grid">
            <div class="grade-card" onclick="selectGrade(this, 1)">
              <span class="grade-emoji">🧒</span>
              <div class="grade-name">一年级</div>
              <div class="grade-stars"><span class="star-filled">⭐</span></div>
            </div>
            <div class="grade-card" onclick="selectGrade(this, 2)">
              <span class="grade-emoji">👦</span>
              <div class="grade-name">二年级</div>
              <div class="grade-stars"><span class="star-filled">⭐</span><span class="star-filled">⭐</span></div>
            </div>
            <div class="grade-card selected" onclick="selectGrade(this, 3)">
              <span class="grade-emoji">🧑‍🎓</span>
              <div class="grade-name">三年级</div>
              <div class="grade-stars"><span class="star-filled">⭐</span><span class="star-filled">⭐</span><span class="star-filled">⭐</span></div>
            </div>
            <div class="grade-card" onclick="selectGrade(this, 4)">
              <span class="grade-emoji">👨‍🎓</span>
              <div class="grade-name">四年级</div>
              <div class="grade-stars"><span class="star-filled">⭐</span><span class="star-filled">⭐</span><span class="star-filled">⭐</span><span class="star-filled">⭐</span></div>
            </div>
            <div class="grade-card" onclick="selectGrade(this, 5)">
              <span class="grade-emoji">🧑‍💻</span>
              <div class="grade-name">五年级</div>
              <div class="grade-stars"><span class="star-filled">⭐</span><span class="star-filled">⭐</span><span class="star-filled">⭐</span><span class="star-filled">⭐</span><span class="star-filled">⭐</span></div>
            </div>
            <div class="grade-card" onclick="selectGrade(this, 6)">
              <span class="grade-emoji">🎓</span>
              <div class="grade-name">六年级</div>
              <div class="grade-stars"><span class="star-filled">⭐</span><span class="star-filled">⭐</span><span class="star-filled">⭐</span><span class="star-filled">⭐</span><span class="star-filled">⭐</span><span class="star-filled">⭐</span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="register-bottom">
        <button class="btn btn-primary" onclick="startLearning()">开始学习 🎯</button>
        <a href="#" class="skip-link" onclick="startLearning(); return false;">先逛逛，稍后设置</a>
      </div>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
function selectGrade(el, grade) {
  document.querySelectorAll('.grade-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

function startLearning() {
  const name = document.getElementById('nicknameInput').value || '小朋友';
  alert(`欢迎 ${name}！开始你的单词冒险吧～ 🚀`);
}
</script>
</body>
</html>
