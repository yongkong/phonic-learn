<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordWorld - 年级注册</title>
<link rel="stylesheet" href="../css/tokens.css">
<style>
  .register-screen {
    min-height: 100%;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  .reg-header { padding: var(--space-sm) var(--space-lg) 0; }

  .reg-body {
    padding: var(--space-md) var(--space-xl) 120px;
    display: flex;
    flex-direction: column;
    gap: var(--space-2xl);
  }

  .reg-title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 800;
    line-height: 1.3;
  }
  .reg-title .hl { color: var(--primary); }
  .reg-sub {
    margin-top: 6px;
    font-size: 15px;
    font-weight: 600;
    color: var(--fg-secondary);
  }

  .field-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 800;
    color: var(--fg);
    margin-bottom: var(--space-md);
  }
  .field-label .hint {
    font-size: 12px;
    font-weight: 600;
    color: var(--fg-tertiary);
  }

  /* 头像选择 */
  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: var(--space-md);
  }
  .avatar-option {
    position: relative;
    aspect-ratio: 1;
    border-radius: var(--radius-md);
    border: 2px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition-fast);
    -webkit-tap-highlight-color: transparent;
  }
  .avatar-option:active { transform: scale(0.92); }
  .avatar-option.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.18); }
  .avatar-option .check {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--primary);
    border: 2px solid #fff;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .avatar-option.selected .check { display: flex; }
  .av-1 { background: #FFD9E0; color: #E0447C; }
  .av-2 { background: #D6DEFF; color: var(--primary); }
  .av-3 { background: #D3F3E7; color: var(--success-dark); }
  .av-4 { background: #FFE9D6; color: var(--accent-dark); }
  .av-5 { background: #F3E3FF; color: #8B5CF6; }
  .av-6 { background: #FEF3D9; color: #B45309; }

  /* 昵称输入 */
  .input-wrap { position: relative; }
  .input-wrap .count {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 700;
    color: var(--fg-tertiary);
    background: var(--surface-alt);
    padding: 2px 8px;
    border-radius: var(--radius-pill);
  }

  /* 年级选择 */
  .grade-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); }
  .grade-card {
    position: relative;
    background: var(--surface);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: var(--space-md) var(--space-sm);
    text-align: center;
    cursor: pointer;
    transition: var(--transition-fast);
    -webkit-tap-highlight-color: transparent;
  }
  .grade-card:active { transform: scale(0.95); }
  .grade-card .g-num {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 800;
    color: var(--fg);
    line-height: 1.1;
  }
  .grade-card .g-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--fg-secondary);
    margin-top: 2px;
  }
  .grade-card.selected {
    border-color: var(--primary);
    background: var(--primary-soft);
  }
  .grade-card.selected .g-num { color: var(--primary); }
  .grade-card .check {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--primary);
    border: 2px solid #fff;
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .grade-card.selected .check { display: flex; }

  .info-strip {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-md) var(--space-lg);
    background: var(--primary-soft);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    color: var(--primary-dark);
    line-height: 1.5;
  }

  /* 底部 CTA */
  .cta-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: var(--space-md) var(--space-xl) 36px;
    background: linear-gradient(180deg, rgba(238,242,255,0) 0%, var(--bg) 40%);
    z-index: 40;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="status-bar dark">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4.5a9 9 0 0 1 12 0"/><path d="M4.5 7a5.5 5.5 0 0 1 7 0"/><circle cx="8" cy="9.8" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" fill="none" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </div>
  </div>

  <div class="screen-content">
    <div class="register-screen">
      <div class="reg-header">
        <button class="icon-btn" aria-label="返回">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>

      <div class="reg-body">
        <div>
          <h1 class="reg-title">你好，准备好<br>开始<span class="hl">单词冒险</span>了吗？</h1>
          <p class="reg-sub">先给自己起个名字，挑一个专属形象吧</p>
        </div>

        <div>
          <div class="field-label"><span>选择形象</span><span class="hint">可以随时更换</span></div>
          <div class="avatar-grid">
            <div class="avatar-option av-1 selected" role="button" aria-label="形象：火箭">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
              <span class="check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
            </div>
            <div class="avatar-option av-2" role="button" aria-label="形象：星星">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10.6l-4.9 3.9 1.6 6-4.7-3.6-4.7 3.6 1.6-6L4 10.6l6.1-1.8z"/></svg>
              <span class="check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
            </div>
            <div class="avatar-option av-3" role="button" aria-label="形象：闪电">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              <span class="check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
            </div>
            <div class="avatar-option av-4" role="button" aria-label="形象：音符">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              <span class="check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
            </div>
            <div class="avatar-option av-5" role="button" aria-label="形象：叶子">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
              <span class="check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
            </div>
            <div class="avatar-option av-6" role="button" aria-label="形象：皇冠">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z"/></svg>
              <span class="check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
            </div>
          </div>
        </div>

        <div>
          <div class="field-label"><span>你的名字</span></div>
          <div class="input-wrap">
            <input class="input-field" type="text" value="小明" maxlength="12" placeholder="给自己起个响亮的名字">
            <span class="count">2 / 12</span>
          </div>
        </div>

        <div>
          <div class="field-label"><span>你在读几年级？</span></div>
          <div class="grade-grid">
            <div class="grade-card" role="button"><div class="g-num">1</div><div class="g-label">一年级</div><span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></div>
            <div class="grade-card" role="button"><div class="g-num">2</div><div class="g-label">二年级</div><span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></div>
            <div class="grade-card selected" role="button"><div class="g-num">3</div><div class="g-label">三年级</div><span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></div>
            <div class="grade-card" role="button"><div class="g-num">4</div><div class="g-label">四年级</div><span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></div>
            <div class="grade-card" role="button"><div class="g-num">5</div><div class="g-label">五年级</div><span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></div>
            <div class="grade-card" role="button"><div class="g-num">6</div><div class="g-label">六年级</div><span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></div>
          </div>
        </div>

        <div class="info-strip">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          我们会按你的年级推荐难度合适的单词，随时可以调整。
        </div>
      </div>
    </div>
  </div>

  <div class="cta-bar">
    <button class="btn btn-primary btn-block">开始冒险</button>
  </div>
  <div class="home-indicator"></div>
</div>

<script>
  // 头像与年级单选
  document.querySelectorAll('.avatar-option').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    });
  });
  document.querySelectorAll('.grade-card').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.grade-card').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    });
  });
  // 字数统计
  const input = document.querySelector('.input-field');
  const count = document.querySelector('.count');
  input.addEventListener('input', () => { count.textContent = input.value.length + ' / 12'; });
</script>
</body>
</html>
