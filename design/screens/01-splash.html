<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordWorld - 启动页</title>
<link rel="stylesheet" href="../css/tokens.css">
<style>
  .splash-screen {
    background: linear-gradient(180deg, #E7EBFF 0%, #F6F7FF 55%, #FFFFFF 100%);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  /* 漂浮字母块装饰 */
  .float-tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    border-radius: var(--radius-md);
    animation: floaty 5s ease-in-out infinite;
    pointer-events: none;
  }
  .ft-1 { top: 118px; left: 38px; width: 44px; height: 44px; font-size: 22px; background: #FFD9D9; color: #E14D4D; transform: rotate(-8deg); }
  .ft-2 { top: 170px; right: 46px; width: 52px; height: 52px; font-size: 26px; background: #D6DEFF; color: var(--primary); transform: rotate(6deg); animation-delay: 1.2s; }
  .ft-3 { top: 320px; left: 64px; width: 38px; height: 38px; font-size: 19px; background: #FFE9D6; color: var(--accent-dark); transform: rotate(10deg); animation-delay: 2.1s; }
  .ft-4 { top: 388px; right: 78px; width: 34px; height: 34px; font-size: 17px; background: #D3F3E7; color: var(--success-dark); transform: rotate(-6deg); animation-delay: 0.6s; }
  .ft-5 { top: 520px; left: 30px; width: 30px; height: 30px; font-size: 15px; background: #F3E3FF; color: #8B5CF6; transform: rotate(8deg); animation-delay: 1.8s; }

  .splash-hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px var(--space-xl);
  }

  .logo-mark {
    width: 96px;
    height: 96px;
    border-radius: 26px;
    background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 60%, var(--primary-dark) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 14px 30px rgba(79, 70, 229, 0.35), inset 0 2px 0 rgba(255,255,255,0.35);
    position: relative;
    margin-bottom: var(--space-2xl);
    animation: pop 0.5s ease both;
  }
  .logo-mark .logo-w {
    font-family: var(--font-display);
    font-size: 52px;
    font-weight: 800;
    color: #FFFFFF;
    line-height: 1;
  }
  .logo-mark .logo-dot {
    position: absolute;
    top: -8px;
    right: -10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid #FFFFFF;
    box-shadow: 0 4px 10px rgba(249, 115, 22, 0.4);
  }

  .wordmark {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 800;
    color: var(--fg);
    letter-spacing: -0.5px;
  }
  .wordmark .wm-accent { color: var(--accent); }

  .wordmark-cn {
    font-size: 18px;
    font-weight: 700;
    color: var(--fg-secondary);
    margin-top: 4px;
    letter-spacing: 6px;
  }

  .tagline {
    margin-top: var(--space-xl);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border-radius: var(--radius-pill);
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    font-size: 14px;
    font-weight: 700;
    color: var(--fg-secondary);
  }

  .splash-footer {
    width: 100%;
    padding: 0 var(--space-2xl) 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-lg);
  }

  .load-track {
    width: 200px;
    height: 8px;
    border-radius: var(--radius-pill);
    background: var(--primary-soft);
    overflow: hidden;
  }
  .load-fill {
    height: 100%;
    width: 30%;
    border-radius: var(--radius-pill);
    background: linear-gradient(90deg, var(--primary-light), var(--primary));
    animation: loading 2.4s ease-in-out infinite;
  }
  @keyframes loading {
    0% { width: 12%; }
    60% { width: 78%; }
    100% { width: 92%; }
  }
  .load-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg-tertiary);
  }
</style>
</head>
<body>
<div class="screen">
  <div class="status-bar dark">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4.5a9 9 0 0 1 12 0"/><path d="M4.5 7a5.5 5.5 0 0 1 7 0"/><circle cx="8" cy="9.8" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" fill="none" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </div>
  </div>

  <div class="screen-content" style="bottom: 0; top: 44px;">
    <div class="splash-screen">
      <div class="float-tile ft-1">a</div>
      <div class="float-tile ft-2">W</div>
      <div class="float-tile ft-3">e</div>
      <div class="float-tile ft-4">b</div>
      <div class="float-tile ft-5">d</div>

      <div class="splash-hero">
        <div class="logo-mark">
          <span class="logo-w">W</span>
          <span class="logo-dot"></span>
        </div>
        <h1 class="wordmark">Word<span class="wm-accent">World</span></h1>
        <div class="wordmark-cn">单词世界</div>
        <div class="tagline">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10.6l-4.9 3.9 1.6 6-4.7-3.6-4.7 3.6 1.6-6L4 10.6l6.1-1.8z"/></svg>
          让每个单词都有故事、有场景
        </div>
      </div>

      <div class="splash-footer">
        <div class="load-track"><div class="load-fill"></div></div>
        <div class="load-text">正在准备你的单词世界…</div>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
</body>
</html>
